<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Sync: Neon Nocturne Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Manrope:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color Tokens */
            --surface-lowest: #000000;
            --surface-dim: #0e0e0e;
            --surface-low: #131313;
            --surface-highest: #262626;
            --primary: #ff8ba1;
            --primary-dim: #e2165f;
            --secondary: #bc83ff;
            --tertiary: #16fefe;
            --on-background: #ffffff;
            --on-surface-variant: #adaaaa;
            --spacing-16: 1rem;
            --spacing-24: 1.5rem;
            --blur: 30px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--surface-lowest);
            color: var(--on-background);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Mesh Gradient Background */
        body::before {
            content: "";
            position: absolute;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(233, 30, 99, 0.15) 0%, transparent 70%);
            z-index: 0;
            filter: blur(80px);
        }

        body::after {
            content: "";
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(22, 254, 254, 0.1) 0%, transparent 70%);
            z-index: 0;
            filter: blur(80px);
        }

        /* Dashboard Container */
        .dashboard {
            width: 390px;
            height: 844px;
            background-color: var(--surface-dim);
            border-radius: 40px;
            position: relative;
            z-index: 10;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding: var(--spacing-24);
        }

        /* Typography Styles */
        h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 2.5rem; letter-spacing: -1px; margin-bottom: 8px; }
        .haptic-number { font-family: 'Space Grotesk', sans-serif; font-weight: 300; font-size: 5rem; color: var(--primary); }
        .label { font-family: 'Plus Jakarta Sans', sans-serif; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px; color: var(--on-surface-variant); margin-bottom: 12px; }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(38, 38, 38, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: var(--spacing-24);
            position: relative;
            margin-top: auto;
            margin-bottom: var(--spacing-24);
        }

        /* Rim Light */
        .glass-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 114, 144, 0.3), transparent);
            border-radius: 24px 24px 0 0;
        }

        /* Haptic Ring Visualizer */
        .ring-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
            position: relative;
        }

        .ring {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid rgba(255, 139, 161, 0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(233, 30, 99, 0.1);
        }

        .ring::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary);
            border-bottom-color: transparent;
            border-left-color: transparent;
            transform: rotate(45deg);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(255, 139, 161, 0.2); }
            50% { box-shadow: 0 0 50px rgba(255, 139, 161, 0.5); }
            100% { box-shadow: 0 0 20px rgba(255, 139, 161, 0.2); }
        }

        /* Primary Button */
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 100px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dim));
            color: white;
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 16px;
        }

        .btn-primary:active { transform: scale(0.95); }

        /* Floating Dock */
        .dock {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60px;
            background: rgba(38, 38, 38, 0.4);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
        }

        .dock::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
        }

        .icon {
            width: 24px;
            height: 24px;
            border: 2px solid var(--secondary);
            border-radius: 50%;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="label" style="margin-top: 20px;">Velvet Sync Lab</div>
        <h1>Active Profile</h1>
        
        <div class="ring-container">
            <div class="ring">
                <div class="haptic-number">72</div>
            </div>
        </div>

        <div class="glass-card">
            <div class="label">System Status</div>
            <p style="font-size: 0.9rem; color: var(--on-surface-variant); line-height: 1.5;">Sync engine operational. Low-latency bridge connected to Love Spouse 8154.</p>
            <button class="btn-primary">INITIATE BURST</button>
        </div>

        <div class="dock">
            <div class="icon"></div>
            <div class="icon" style="background: var(--secondary); opacity: 1;"></div>
            <div class="icon"></div>
        </div>
    </div>
</body>
</html>
