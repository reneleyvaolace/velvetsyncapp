<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D0D12">
  <title>Restablecer Contraseña - Velvet Sync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D0D12;
      --card: #1A1A2E;
      --accent: #E91E63;
      --accent-hover: #D81B60;
      --border: #33334D;
      --text: #FFFFFF;
      --text-muted: #A0A0B0;
      --error: #FF4444;
      --success: #00C851;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 8px rgba(233, 30, 99, 0.4));
    }

    .logo-text {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .logo-sub {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-weight: 500;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text);
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    #status {
      min-height: 20px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .status-error { color: var(--error); }
    .status-success { color: var(--success); }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.4px;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.15);
    }

    input[type="password"]::placeholder {
      color: #666677;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
      margin-top: 8px;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button[type="submit"]:active:not(:disabled) {
      transform: scale(0.98);
    }

    button[type="submit"]:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      background: #444455;
    }

    .footer-links {
      margin-top: 32px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider:not(:empty)::before { margin-right: 12px; }
    .divider:not(:empty)::after { margin-left: 12px; }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .back-home:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      .logo-text { font-size: 24px; }
      h1 { font-size: 20px; }
    }

    @media (max-width: 360px) {
      body { padding: 16px; }
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logo -->
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Velvet Sync">
      <rect width="100" height="100" rx="24" fill="#0D0D12" stroke="#33334D" stroke-width="2"/>
      <path d="M50 20 Q70 20 80 40 Q80 60 50 60 Q20 60 20 40 Q20 20 50 20 Z" fill="none" stroke="#E91E63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="40" r="6" fill="#E91E63"/>
    </svg>
    <div class="logo-text">VELVET SYNC</div>
    <div class="logo-sub">Restablecimiento de contraseña</div>

    <h1>Nueva contraseña</h1>
    <p class="subtitle">Ingresa tu nueva contraseña para completar el restablecimiento.</p>

    <div id="status"></div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="newPassword">Nueva contraseña</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" minlength="6" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" minlength="6" required autocomplete="new-password">
      </div>
      <button type="submit" id="submitBtn">Restablecer contraseña</button>
    </form>

    <div class="footer-links">
      <a href="https://velvetsynccatalog.vercel.app/" class="back-home">← Volver al Catálogo</a>
    </div>
  </div>

  <script>
    (function() {
      const SUPABASE_URL = 'https://baeclricgedhxdtmirid.supabase.co';

      const urlParams = new URLSearchParams(window.location.search);
      const accessToken = urlParams.get('access_token');
      const refreshToken = urlParams.get('refresh_token');
      const type = urlParams.get('type');

      const statusEl = document.getElementById('status');
      const form = document.getElementById('resetForm');
      const submitBtn = document.getElementById('submitBtn');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');

      function showStatus(message, type) {
        statusEl.innerHTML = `<span class="status-${type}">${message}</span>`;
      }

      function clearStatus() {
        statusEl.innerHTML = '';
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.textContent = loading ? 'Procesando...' : 'Restablecer contraseña';
      }

      // Validar token de restablecimiento
      if (!accessToken) {
        showStatus('❌ Enlace de restablecimiento no válido o expirado. Solicita uno nuevo desde la app.', 'error');
        form.style.display = 'none';
        return;
      }

      if (type !== 'recovery') {
        showStatus('❌ Tipo de token no válido para restablecimiento de contraseña.', 'error');
        form.style.display = 'none';
        return;
      }

      // Manejo del envío del formulario
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearStatus();

        const newPassword = newPasswordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();

        // Validaciones del lado del cliente
        if (newPassword.length < 6) {
          showStatus('❌ La contraseña debe tener al menos 6 caracteres.', 'error');
          return;
        }

        if (newPassword !== confirmPassword) {
          showStatus('❌ Las contraseñas no coinciden.', 'error');
          return;
        }

        setLoading(true);

        try {
          const response = await fetch(`${SUPABASE_URL}/auth/v1/update`, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${accessToken}`,
              'Content-Type': 'application/json',
              'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhZWNscmljZ2VkaHhkdG1pcmlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMTUwMjYsImV4cCI6MjA4ODU5MTAyNn0.lPUuU6RiUGyaf36NJH4HysIkgTe8qFxt4CxA5OnjvjU'
            },
            body: JSON.stringify({
              password: newPassword
            })
          });

          const data = await response.json().catch(() => ({}));

          if (response.ok) {
            showStatus('✅ Contraseña actualizada correctamente. Ya puedes iniciar sesión con tu nueva contraseña.', 'success');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Listo';
            submitBtn.style.background = '#00C851';

            // Redirigir al catálogo después de 2 segundos
            setTimeout(() => {
              window.location.href = 'https://velvetsynccatalog.vercel.app/';
            }, 2000);
          } else {
            const msg = data.msg || data.message || data.error || 'Error al actualizar la contraseña.';
            showStatus(`❌ ${msg}`, 'error');
            setLoading(false);
          }
        } catch (err) {
          showStatus('❌ Error de conexión. Intenta nuevamente.', 'error');
          setLoading(false);
        }
      });
    })();
  </script>
</body>
</html>
